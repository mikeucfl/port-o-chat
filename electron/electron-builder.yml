appId: com.lttldrgn.portochat
productName: Port-O-Chat
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Network
